name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # nightly long run
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz, in seconds"
        default: "900"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libfuzzer:
    name: libFuzzer (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 3 min on pushes/PRs, 30 min nightly, or whatever was asked for
      SECONDS_TO_FUZZ: ${{ github.event_name == 'schedule' && '1800' || github.event.inputs.seconds || '180' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Make sure clang has the libFuzzer runtime
        run: |
          echo 'int LLVMFuzzerTestOneInput(const char *d, unsigned long n){return 0;}' > /tmp/t.c
          if ! clang -fsanitize=fuzzer /tmp/t.c -o /tmp/t 2>/dev/null; then
            v=$(clang -dumpversion | cut -d. -f1)
            sudo apt-get update -q && sudo apt-get install -y -q "libclang-rt-$v-dev"
          fi
          clang --version | head -1

      - name: Build fuzzer
        run: uv run python tools/build.py --fuzz

      - name: Generate seeds
        run: uv run python fuzz/make_seeds.py build/fuzz/seeds

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz for ${{ env.SECONDS_TO_FUZZ }}s
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/artifacts
          build/fuzz_parse \
            -fork="$(nproc)" -max_total_time="$SECONDS_TO_FUZZ" \
            -timeout=2 -rss_limit_mb=2048 -max_len=4096 \
            -dict=fuzz/dateutil.dict -print_final_stats=1 \
            -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus build/fuzz/seeds

      - name: Minimize corpus
        if: always()
        run: |
          mkdir -p build/fuzz/min
          build/fuzz_parse -merge=1 build/fuzz/min build/fuzz/corpus build/fuzz/seeds 2>&1 | tail -1
          rm -rf build/fuzz/corpus && mv build/fuzz/min build/fuzz/corpus
          echo "corpus: $(ls build/fuzz/corpus | wc -l) inputs"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
