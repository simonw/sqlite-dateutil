name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:  # run by release.yml before it builds wheels

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        platform:
          - name: Linux (gcc)
            os: ubuntu-latest
          - name: macOS (clang)
            os: macos-latest
          - name: Windows (MSVC)
            os: windows-latest
            msvc: true
          - name: Windows (MinGW gcc)
            os: windows-latest
            cc: gcc
    env:
      CC: ${{ matrix.platform.cc }}  # empty means build.py picks the platform default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Put MSVC on PATH
        if: matrix.platform.msvc
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Build extension
        run: uv run python tools/build.py --force
      - name: Run tests
        run: uv run pytest -rs
