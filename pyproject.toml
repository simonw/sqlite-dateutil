[project]
name = "sqlite-dateutil"
version = "0.1a0"
description = "A SQLite extension porting dateutil.parser.parse() to C"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Simon Willison"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/simonw/sqlite-dateutil"
Issues = "https://github.com/simonw/sqlite-dateutil/issues"
Changelog = "https://github.com/simonw/sqlite-dateutil/releases"
CI = "https://github.com/simonw/sqlite-dateutil/actions"

[dependency-groups]
dev = ["hypothesis", "pytest", "python-dateutil"]

[tool.uv]
# Not a Python package: uv just manages the test environment.
package = false
# Always use a uv-managed Python. System Pythons (e.g. Apple's
# /usr/bin/python3) may be built without SQLite extension loading.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
